function show(html){ov.innerHTML=`<div class="modal">${html}</div>`;ov.classList.add('show');mode='overlay'}function close(){ov.classList.remove('show');ov.innerHTML='';mode='map';render();status()}
function talk(n){if(n.id==='elder'){show(`<h2>👴 村の長老</h2><p>「ことばの国から、三つの『知恵の光』が消えてしまった。森とどうくつの試練をこえ、魔王をたおしておくれ！」</p><p>${p.flags.forest?'🌿 森の光：入手ずみ':'🌿 森の光：まだ'}<br>${p.flags.cave?'💎 どうくつの光：入手ずみ':'💎 どうくつの光：まだ'}<br>${p.flags.boss?'👑 魔王：たおした':'👑 魔王：まだ'}</p><button id="rest">村で休む（HP全回復）</button> <button id="close">とじる</button>`);$('rest').onclick=()=>{p.hp=p.maxhp;save();close();say('ゆっくり休んで元気になった！')};$('close').onclick=close}
if(n.id==='shop')shop();if(n.id==='forestSpirit'){if(p.flags.forest){show('<h2>🌿 森の精</h2><p>「森の光を取りもどしてくれてありがとう！ 次はどうくつへ。」</p><button id="close">とじる</button>');$('close').onclick=close}else trial('forest','🌿 森の精','森の知恵をたしかめましょう。３問のうち２問正解で、道が開きます。')}
if(n.id==='scholar'){if(p.flags.cave){show('<h2>📚 学者</h2><p>「よく学んだね。いよいよ魔王の城だ！」</p><button id="close">とじる</button>');$('close').onclick=close}else trial('cave','📚 どうくつの学者','知恵の試練です。４問のうち３問正解すれば城への道が開きます。')}
if(n.id==='boss'){if(p.flags.boss){show('<h2>👑 ことばの魔王</h2><p>「見事だ！ ことばの力にはかなわなかった。」</p><button id="close">とじる</button>');$('close').onclick=close}else if(!p.flags.forest||!p.flags.cave){say('魔王「二つの知恵の光を集めてから来るがよい！」')}else startBattle({name:'ことばの魔王',icon:'👑',hp:75,atk:10,xp:100,gold:150,boss:true})}}
function shop(){show(`<h2>🧺 道具屋</h2><p>「やくそうは 20G。戦闘中に HP を 20 回復できるよ！」</p><p>持ち金：${p.gold}G　やくそう：${p.potions}こ</p><button id="buy">やくそうを買う（20G）</button> <button id="close">とじる</button>`);$('buy').onclick=()=>{if(p.gold<20){$('buy').textContent='お金が足りない！';return}p.gold-=20;p.potions++;save();shop()};$('close').onclick=close}
function nextQ(){let pool=qbank.map((q,i)=>i).filter(i=>!p.questionHistory.slice(-12).includes(i));if(!pool.length)pool=qbank.map((_,i)=>i);const id=pool[Math.floor(Math.random()*pool.length)];p.questionHistory.push(id);if(p.questionHistory.length>24)p.questionHistory.shift();const q=qbank[id];const order=[0,1,2,3].sort(()=>Math.random()-.5);return{q,order}}
function quiz(onAnswer){const {q,order}=nextQ();p.asked++;const content=`<div class="small">📖 ${q[0]}　／　正しい答えを選ぼう</div><h2>${q[1].replaceAll('\n','<br>')}</h2><div class="choices">${order.map((id,i)=>`<button data-a="${id}">${i+1}. ${q[2][id]}</button>`).join('')}</div><div id="feedback" class="small">答えを選んでください。</div>`;show(content);ov.querySelectorAll('[data-a]').forEach(btn=>btn.onclick=()=>{const yes=Number(btn.dataset.a)===q[3];if(yes)p.correct++;ov.querySelectorAll('[data-a]').forEach(b=>{b.disabled=true;if(Number(b.dataset.a)===q[3])b.classList.add('correct');else if(b===btn)b.classList.add('wrong')});$('feedback').innerHTML=`<b>${yes?'⭕ 正解！':'❌ ざんねん！'}</b><br>${q[4]}<br><button id="next" style="margin-top:10px">つぎへ ▶</button>`;$('next').onclick=()=>{save();onAnswer(yes)};save()})}
function trial(id,title,desc){let count=0,good=0,total=id==='forest'?3:4,need=id==='forest'?2:3;function ask(){if(count>=total){if(good>=need){p.flags[id]=true;p.gold+=30;save();show(`<h2>${title}</h2><p>✨ 試練クリア！ ${good}/${total}問正解！</p><p>知恵の光と 30G を手に入れた。次の場所へ進もう！</p><button id="close">冒険にもどる</button>`)}else show(`<h2>${title}</h2><p>${good}/${total}問正解。あと少し！ 何度でも挑戦できるよ。</p><button id="retry">もう一度</button> <button id="close">もどる</button>`);$('close').onclick=close;if($('retry'))$('retry').onclick=()=>trial(id,title,desc);return}quiz(yes=>{count++;if(yes)good++;ask()});const label=document.createElement('div');label.className='small tag';label.textContent=`${title}　${count+1}/${total}問目（${need}問正解で合格）`;ov.querySelector('.modal').prepend(label)}show(`<h2>${title}</h2><p>${desc}</p><button id="begin">試練をはじめる</button> <button id="close">あとで</button>`);$('begin').onclick=ask;$('close').onclick=close}
function startBattle(enemy){battle={...enemy,max:enemy.hp,turn:0,guard:false};battleMenu(`野生の ${enemy.name} があらわれた！`)}function battleMenu(log){if(!battle)return;const e=battle;show(`<div class="small tag">⚔️ ことばバトル</div><div class="enemyart">${e.icon}</div><h2 style="text-align:center">${e.name}</h2><div>敵 HP ${Math.max(0,e.hp)}/${e.max}<div class="bar"><i style="width:${Math.max(0,e.hp)/e.max*100}%"></i></div></div><div>勇者 HP ${p.hp}/${p.maxhp}<div class="bar"><i style="width:${p.hp/p.maxhp*100}%"></i></div></div><div id="log">${log}</div><div class="choices"><button id="attack">⚔️ こたえて攻撃</button><button id="heal">🧪 やくそう (${p.potions})</button><button id="guard">🛡️ ぼうぎょ</button><button id="run" ${e.boss?'disabled':''}>🏃 にげる</button></div>`);$('attack').onclick=()=>quiz(yes=>{let dmg=yes?12+p.level*4:0;if(yes){e.hp-=dmg;if(e.hp<=0){win();return}}enemyTurn(yes?`正解！ ${dmg} ダメージ！`:'不正解！ 攻撃できなかった。')});$('heal').onclick=()=>{if(!p.potions){battleMenu('やくそうを持っていない！');return}p.potions--;const h=Math.min(20,p.maxhp-p.hp);p.hp+=h;enemyTurn(`やくそうで HP を ${h} 回復した。`)};$('guard').onclick=()=>{e.guard=true;enemyTurn('身を守った。敵のダメージが半分になる！')};$('run').onclick=()=>{if(Math.random()<.75){battle=null;close();say('うまく逃げ切れた！')}else enemyTurn('逃げられなかった！')}}function enemyTurn(log){const e=battle;if(!e)return;let dmg=Math.max(1,e.atk+Math.floor(Math.random()*3)-1);if(e.guard)dmg=Math.ceil(dmg/2);e.guard=false;p.hp=Math.max(0,p.hp-dmg);save();if(p.hp===0){show(`<h2>💫 勇者はたおれた！</h2><p>${log}<br>${e.name} の攻撃！ ${dmg} ダメージ。</p><p>村に戻ってもう一度挑戦しよう。経験値とお金はそのまま残るよ。</p><button id="revive">村で目を覚ます</button>`);$('revive').onclick=()=>{battle=null;p.area='village';p.x=3;p.y=8;p.hp=p.maxhp;save();close();say('長老に助けられ、村で目を覚ました。')};return}battleMenu(`${log}<br>${e.name} の攻撃！ ${dmg} ダメージ。`)}function win(){const e=battle;p.wins++;p.xp+=e.xp;p.gold+=e.gold;let leveled=0;while(p.xp>=p.level*25){p.xp-=p.level*25;p.level++;p.maxhp+=8;p.hp=p.maxhp;leveled++}if(e.boss)p.flags.boss=true;save();show(`<h2>🎉 勝利！</h2><div class="enemyart">✨</div><p>${e.name} をたおした！</p><p>経験値 +${e.xp}　お金 +${e.gold}G</p>${leveled?`<p class="tag">レベルアップ！ Lv.${p.level}　最大HPがふえた！</p>`:''}${e.boss?'<p class="tag">🏆 エンディング：ことばの国に平和がもどった！<br>長老のところへ帰ろう。冒険はこの後も続けられるよ。</p>':''}<button id="finish">冒険をつづける</button>`);$('finish').onclick=()=>{battle=null;close();say(e.boss?'✨ おめでとう！ ことばの国を救った！':'敵をたおした！ 冒険を続けよう。')}}
function menu(){show(`<h2>📜 冒険の記録</h2><div class="quest">🌿 森の試練：${p.flags.forest?'クリア':'未クリア'}</div><div class="quest">💎 どうくつの試練：${p.flags.cave?'クリア':'未クリア'}</div><div class="quest">👑 魔王：${p.flags.boss?'勝利！':'未クリア'}</div><p>Lv.${p.level}　勝利 ${p.wins}回<br>問題の正解数 ${p.correct}/${p.asked}　正解率 ${p.asked?Math.round(p.correct/p.asked*100):0}%</p><p class="small">探索のヒント：村の東から森へ。森の精 → どうくつの学者 → 魔王の順に進もう。宝箱はＡで開けられる。</p><button id="close">もどる</button> <button id="reset">はじめから</button>`);$('close').onclick=close;$('reset').onclick=()=>{if(confirm('冒険の記録を消して、はじめから遊びますか？')){p=fresh();save();close();say('新しい冒険がはじまった！')}}}
$('actBtn').onclick=action;$('menuBtn').onclick=()=>{if(mode==='map')menu()};$('helpBtn').onclick=()=>{if(mode!=='map')return;show('<h2>🎮 あそびかた</h2><p>① 方向ボタンで歩く。<br>② 人や宝箱のとなりで、そちらを向いて「Ａ」を押す。<br>③ 森とどうくつで試練に挑戦する。<br>④ モンスターとの戦いでは、国語の問題に正解して攻撃する。<br>⑤ 二つの光を集めて魔王をたおそう！</p><p class="small">セーブは自動です。iPhoneでもパソコンでも遊べますが、セーブデータは端末・ブラウザごとに保存されます。</p><button id="close">わかった！</button>');$('close').onclick=close};document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(b.dataset.dir));window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter'].includes(e.key))e.preventDefault();if(mode!=='map')return;const d={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'}[e.key];if(d)move(d);else if(e.key==='Enter'||e.key===' ')action();else if(e.key==='Escape')menu()});let sx=0,sy=0;cv.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});cv.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>25)move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up');else action()},{passive:true});render();status();if(!p.flags.started){p.flags.started=true;save();say('📜 ことばの国に暗い影がせまっている。まずは村の長老に話しかけよう！')}else say('おかえり！ 冒険の続きからスタート！');
})();</script></body></html>
